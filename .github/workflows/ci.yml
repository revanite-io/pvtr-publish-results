name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race ./...
      - run: test -z "$(gofmt -l .)"
      # actionlint v1.7.12 does not know job.workflow_sha yet (documented, GitHub.com only).
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -ignore 'property "workflow_sha" is not defined'
