# Reusable workflow: run one pvtr plugin against one target and publish its
# EvaluationLogs to grc.store as signed bundles whose Sigstore certificate
# names THIS workflow. The hub grants the verified tier by comparing the
# certificate's job_workflow_ref with
#
#   revanite-io/pvtr-publish-results/.github/workflows/publish.yml@refs/tags/v1
#
# so the repo name, this file's path, and the v1 tag are the trust root.
# Renaming or moving any of them invalidates every result published so far.
#
# Two jobs on purpose. The plugin is third-party code, so it runs in a job
# that holds no token able to mint this workflow's identity, and its
# evaluator binding is recorded before it runs. A fresh runner then publishes.
name: Publish verified results

on:
  workflow_call:
    inputs:
      target:
        description: "<namespace>/<id>@<version> the results describe. Namespace is the target owner's org; the hub must trust the calling repo to publish under it."
        type: string
        required: true
      license:
        description: SPDX expression the logs are published under, e.g. CC0-1.0
        type: string
        required: true
      config:
        description: Path in the caller's checkout of a pvtr config naming exactly one target. Mutually exclusive with the config secret.
        type: string
        required: false
      dry-run:
        description: Run everything but the publish. Bundles are written to OCI layouts and uploaded as the pvtr-bundles artifact; nothing is signed or sent to the hub.
        type: boolean
        default: false
    secrets:
      config:
        description: Inline pvtr config, for plugins whose vars carry secrets (pvtr reads vars from the config file only). Mutually exclusive with the config input.
        required: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # the caller's checkout; no id-token here
    outputs:
      evaluator-coordinate: ${{ steps.evaluator.outputs.coordinate }}
      evaluator-digest: ${{ steps.evaluator.outputs.digest }}
      started-at: ${{ steps.run.outputs.started-at }}
      exit-code: ${{ steps.run.outputs.exit-code }}
    env:
      # PVTR_* is read by pvtr and by the plugin it spawns (viper AutomaticEnv),
      # which is how the run is forced to gemara output without editing the
      # caller's config. Env outranks the config file, so the caller cannot
      # redirect the hub, the output format, or the paths from there.
      PVTR_OUTPUT: gemara
      PVTR_WRITE: "true"
      PVTR_HUB_URL: https://hub.grc.store
    steps:
      - name: Resolve config and paths
        env:
          CONFIG_PATH: ${{ inputs.config }}
          CONFIG_INLINE: ${{ secrets.config }}
        run: |
          {
            echo "PVTR_WRITE_DIRECTORY=$RUNNER_TEMP/results"
            echo "PVTR_BINARIES_PATH=$RUNNER_TEMP/plugins"
            echo "TOOL_DIR=$RUNNER_TEMP/tools"
          } >> "$GITHUB_ENV"
          if [ -n "$CONFIG_PATH" ] && [ -n "$CONFIG_INLINE" ]; then
            echo "::error::pass either the config input or the config secret, not both"; exit 1
          fi
          if [ -n "$CONFIG_INLINE" ]; then
            printf '%s\n' "$CONFIG_INLINE" > "$RUNNER_TEMP/config.yml"
            echo "PVTR_CONFIG=$RUNNER_TEMP/config.yml" >> "$GITHUB_ENV"
          elif [ -n "$CONFIG_PATH" ]; then
            echo "PVTR_CONFIG=$GITHUB_WORKSPACE/$CONFIG_PATH" >> "$GITHUB_ENV"
          else
            echo "::error::a pvtr config is required: the config input (a path) or the config secret (inline)"; exit 1
          fi

      - name: Check out the caller
        if: inputs.config != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pvtr
        env:
          PVTR_VERSION: v0.23.0
          PVTR_SHA256: 79f69ca91470d99269f957703784b57de532f0a242d9c3c442ff0b0d266564f8 # pvtr_Linux_x86_64.tar.gz
          GH_TOKEN: ${{ github.token }} # attestation lookup only
        run: |
          mkdir -p "$TOOL_DIR" && cd "$TOOL_DIR"
          curl -sSfL -o pvtr.tar.gz "https://github.com/privateerproj/privateer/releases/download/$PVTR_VERSION/pvtr_Linux_x86_64.tar.gz"
          echo "$PVTR_SHA256  pvtr.tar.gz" | sha256sum -c -
          gh attestation verify pvtr.tar.gz --repo privateerproj/privateer
          tar -xzf pvtr.tar.gz pvtr
          echo "$TOOL_DIR" >> "$GITHUB_PATH"

      # A fresh binaries path holds exactly the one plugin the config names,
      # verified end to end by pvtr install (signature, signer identity,
      # digest chain) before it is written.
      - name: Install the plugin from grc.store
        run: pvtr install --from-config

      # Read before the plugin runs. Step outputs are fixed once the step
      # ends, so the plugin cannot later attribute its log to another plugin.
      - name: Record the evaluator binding
        id: evaluator
        run: |
          m="$PVTR_BINARIES_PATH/plugins.json"
          n=$(jq '.plugins | length' "$m")
          if [ "$n" != 1 ]; then
            echo "::error::expected exactly one installed plugin, found $n"; exit 1
          fi
          {
            echo "coordinate=$(jq -r '[.plugins[]][0].coordinate // empty' "$m")"
            echo "digest=$(jq -r '[.plugins[]][0].indexDigest // empty' "$m")"
          } >> "$GITHUB_OUTPUT"

      # The runner user has passwordless sudo, and the plugin would inherit
      # it. A throwaway user with no sudo keeps the plugin away from the
      # runner process (which holds the outputs recorded above) and from the
      # code of the steps that follow.
      - name: Run pvtr
        id: run
        run: |
          echo "started-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          sudo useradd --create-home --shell /usr/sbin/nologin pvtr
          mkdir -p "$PVTR_WRITE_DIRECTORY"
          sudo chown -R pvtr: "$PVTR_WRITE_DIRECTORY" "$PVTR_BINARIES_PATH"
          set +e
          sudo -H -u pvtr --preserve-env=PVTR_OUTPUT,PVTR_WRITE,PVTR_HUB_URL,PVTR_WRITE_DIRECTORY,PVTR_BINARIES_PATH,PVTR_CONFIG \
            "$TOOL_DIR/pvtr" run
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"
          # pvtr writes results 0640; the upload runs as the runner user.
          sudo chmod -R a+rX "$PVTR_WRITE_DIRECTORY"

      - name: Hand the results to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pvtr-results
          path: ${{ env.PVTR_WRITE_DIRECTORY }}
          if-no-files-found: error

  publish:
    needs: run
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the hub bearer (trusted publishing) and the Sigstore identity
    steps:
      # An empty SHA would check the publisher out at its default branch,
      # silently unpinning it from the certificate. job.workflow_sha is not
      # available on GitHub Enterprise Server.
      - name: Require the workflow commit
        env:
          PUBLISHER_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$PUBLISHER_SHA" ]; then
            echo "::error::job.workflow_sha is empty; cannot pin the publisher to this workflow's commit"; exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pvtr-results
          path: ${{ runner.temp }}/results

      # The publisher is checked out at the commit of this workflow file, so
      # the code that runs is the code the certificate names. The repository
      # is spelled out rather than taken from job.workflow_repository: it is
      # the trust root, and a fork must not quietly publish its own publisher.
      - name: Check out the publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: revanite-io/pvtr-publish-results
          ref: ${{ job.workflow_sha }}
          path: .pvtr-publish-results
          persist-credentials: false

      # No module cache: caches belong to the caller's repository, and a
      # restored module directory is not re-verified against go.sum. Modules
      # are fetched fresh through the proxy and checked against go.sum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .pvtr-publish-results/go.mod
          cache: false

      - name: Publish results
        working-directory: .pvtr-publish-results
        env:
          TARGET: ${{ inputs.target }}
          LICENSE: ${{ inputs.license }}
          EVALUATOR_COORDINATE: ${{ needs.run.outputs.evaluator-coordinate }}
          EVALUATOR_DIGEST: ${{ needs.run.outputs.evaluator-digest }}
          STARTED_AT: ${{ needs.run.outputs.started-at }}
          EXIT_CODE: ${{ needs.run.outputs.exit-code }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then set -- --dry-run "$RUNNER_TEMP/bundles"; fi
          go run . "$@" \
            --write-directory "$RUNNER_TEMP/results" \
            --evaluator-coordinate "$EVALUATOR_COORDINATE" \
            --evaluator-digest "$EVALUATOR_DIGEST" \
            --target "$TARGET" \
            --license "$LICENSE" \
            --started-at "$STARTED_AT" \
            --run-exit-code "$EXIT_CODE"

      - name: Upload the dry-run bundles
        if: inputs.dry-run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pvtr-bundles
          path: ${{ runner.temp }}/bundles
          if-no-files-found: error

      # Failing results are published (they are the honest record) and then
      # the job still reports the run's outcome.
      - name: Report the run's outcome
        env:
          EXIT_CODE: ${{ needs.run.outputs.exit-code }}
        run: exit "$EXIT_CODE"
